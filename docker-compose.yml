services:
  postgres:
    image: postgres:16-alpine
    container_name: healthhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthhub
      POSTGRES_USER: healthhub
      POSTGRES_PASSWORD: ${HEALTHHUB_DB_PASSWORD}
    volumes:
      - healthhub_postgres_data:/var/lib/postgresql/data
    networks:
      - healthhub_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthhub -d healthhub"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    container_name: healthhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthhub:${HEALTHHUB_DB_PASSWORD}@postgres:5432/healthhub
      HEALTHHUB_INGEST_KEY: ${HEALTHHUB_INGEST_KEY}
      TZ: Europe/Madrid
    command:
      - /bin/sh
      - -ec
      - |
        pip install --no-cache-dir fastapi 'uvicorn[standard]' 'psycopg[binary]'
        mkdir -p /app
        printf '%s' '' | base64 -d > /app/main.py
        exec uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8080
    networks:
      - healthhub_private
      - cloudflare_tunnel

  backup:
    image: postgres:16-alpine
    container_name: healthhub-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${HEALTHHUB_DB_PASSWORD}
      BACKUP_ENCRYPTION_PASSWORD: ${HEALTHHUB_BACKUP_ENCRYPTION_PASSWORD}
      TZ: Europe/Madrid
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache openssl
        mkdir -p /backups/healthhub
        while true; do
          stamp=$$(date +%F)
          tmp=/tmp/healthhub-$${stamp}.sql
          out=/backups/healthhub/healthhub-$${stamp}.sql.gz.enc
          pg_dump -h postgres -U healthhub -d healthhub > "$$tmp"
          gzip -9 -c "$$tmp" | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_PASSWORD > "$$out"
          rm -f "$$tmp"
          find /backups/healthhub -type f -name "healthhub-*.sql.gz.enc" -mtime +30 -delete
          sleep 86400
        done
    volumes:
      - healthhub_backups:/backups
    networks:
      - healthhub_private
      - cloudflare_tunnel

  # ============================================================================
  # REPORTER v2.0 - Health Report Generator
  # Clona desde GitHub y ejecuta con Base64 (Simple y Sostenible)
  # ============================================================================
  reporter:
    image: python:3.12-slim
    container_name: healthhub-reporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthhub:${HEALTHHUB_DB_PASSWORD}@postgres:5432/healthhub
      NIGHTSCOUT_URL: http://nightscout:1337
      NIGHTSCOUT_API_SECRET: ${NIGHTSCOUT_API_SECRET}
      TZ: Europe/Madrid
    command:
      - /bin/sh
      - -ec
      - |
        apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
        mkdir -p /app /reports/healthhub/reports
        printf '%s' '' | base64 -d > /app/reporter.sh
        exec /bin/sh /app/reporter.sh
    volumes:
      - healthhub_backups:/reports
      - nightscout_reports:/glucose-reports:ro
    networks:
      - healthhub_private
      - cloudflare_tunnel

volumes:
  healthhub_postgres_data:
  healthhub_backups:
    external: true
    name: nightscout_nightscout_backups
  nightscout_reports:
    external: true
    name: nightscout_nightscout_reports

networks:
  healthhub_private:
    name: healthhub_private
    internal: true
  cloudflare_tunnel:
    external: true
    name: cloudflare_tunnel_default
